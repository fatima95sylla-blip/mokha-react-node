server:
  port: ${PORT:8080}

spring:
  application:
    name: mokha-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mokha}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-for-local-mokha-2026}
    expiration: ${JWT_EXPIRATION:PT15M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  bootstrap-admin:
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@mokha.com}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:Mokha@123!}